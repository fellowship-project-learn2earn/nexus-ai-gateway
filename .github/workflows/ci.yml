name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check the minimum supported Python version
        run: vermin --target=3.9- --no-tips --violations baalebos_ai
      - name: Tests
        run: pytest -q
      - name: Build and check the distribution
        run: |
          python -m build
          twine check dist/*

  node:
    name: sql and gateway engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix tests/node
      - run: npm test --prefix tests/node

  # Single gate. Named "build" because the previous workflow's job had that name, so a branch-protection
  # rule requiring it keeps working. `always()` makes a failed dependency fail this job instead of skipping it.
  build:
    name: build
    needs: [python, node]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have passed
        run: |
          echo "python: ${{ needs.python.result }}  node: ${{ needs.node.result }}"
          test "${{ needs.python.result }}" = "success" && test "${{ needs.node.result }}" = "success"
