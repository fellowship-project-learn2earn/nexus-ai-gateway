name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  id-token: write  # required for Trusted Publishing (OIDC)

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No API token needed -- Trusted Publishing uses short-lived
        # OIDC credentials instead. Configure this repo as a trusted
        # publisher at pypi.org/manage/project/baalebos-ai/settings/publishing/
